spring:
  application:
    name: relay-api
  threads:
    virtual:
      # Espera longa e SSE seguram conexões por minutos; com virtual threads isso custa quase nada.
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  ai:
    mcp:
      server:
        name: relay
        version: 0.0.1
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true

springdoc:
  api-docs:
    path: /openapi.json
